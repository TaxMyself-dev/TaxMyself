<ion-content [fullscreen]="true">
<div class="screen-admin-panel">
  <!-- Use direct property and event binding for selectedTab -->
  <div>
    <app-tab-bar [tabs]="tabs" [selectedTab]="selectedTab" (selectedTabChange)="onTabChange($event)"></app-tab-bar>
  </div>

  <div>
  <app-clients-dashboard *ngIf="selectedTab === 'clients-dashboard'">
  </app-clients-dashboard>
  <app-admin-tax-file *ngIf="selectedTab === 'tax-file'"></app-admin-tax-file>
  <section *ngIf="selectedTab === 'catalog-management'" class="catalog-management">
    <app-tab-bar
      [tabs]="catalogTabs"
      [selectedTab]="selectedCatalogTab"
      (selectedTabChange)="onCatalogTabChange($event)">
    </app-tab-bar>
    <app-category-management *ngIf="selectedCatalogTab === 'categories'">
    </app-category-management>
    <app-booking-account-catalog *ngIf="selectedCatalogTab === 'cards'" mode="admin">
    </app-booking-account-catalog>
  </section>
  <app-trans-management *ngIf="selectedTab === 'trans-management'"></app-trans-management>
  <app-demo-data *ngIf="selectedTab === 'demo-data'"></app-demo-data>
  <app-admin-billing *ngIf="selectedTab === 'billing'"></app-admin-billing>
  <app-admin-shaam-allocations *ngIf="selectedTab === 'shaam-allocations'"></app-admin-shaam-allocations>
  <app-admin-content *ngIf="selectedTab === 'content'"></app-admin-content>
  <app-admin-documentation *ngIf="selectedTab === 'documentation'"></app-admin-documentation>
</div>

  <!-- <app-manage-categories *ngIf="selectedTab === 'manage-categories'"></app-manage-categories> -->
  <!-- <app-track-expenses *ngIf="selectedTab === 'track-expenses'"></app-track-expenses> -->
</div>
</ion-content>
