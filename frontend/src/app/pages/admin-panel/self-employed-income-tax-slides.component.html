<section class="income-slide" [ngClass]="'income-slide--' + slide.layout" dir="rtl">
  <header>
    <h2>{{ slide.title }}</h2>
    @if (slide.layout === 'micro-blockers' && slide.subtitle) { <p>{{ slide.subtitle }}</p> }
  </header>

  @if (slide.layout === 'income-overview' || slide.layout === 'status-comparison') {
    <app-self-employed-income-overview [slide]="slide"></app-self-employed-income-overview>
  } @else {
    <app-self-employed-income-flow [slide]="slide"></app-self-employed-income-flow>
  }

  <footer>@if (slide.takeaway) { <p>{{ slide.takeaway }}</p> }</footer>
</section>
