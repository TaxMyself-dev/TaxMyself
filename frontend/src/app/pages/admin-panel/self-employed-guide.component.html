<section class="presentation" #presentationRoot dir="rtl">
  <div class="presentation-toolbar">
    <button type="button" class="toolbar-button" (click)="closeGuide.emit()">
      <ion-icon name="close-outline"></ion-icon>
      חזרה לתוכן
    </button>
    <div class="presentation-toolbar__title">הדרכה לעצמאים</div>
    <div class="presentation-toolbar__actions">
      <button type="button" class="toolbar-button toolbar-button--fullscreen" (click)="toggleFullscreen()">
        <ion-icon [name]="isFullscreen ? 'contract-outline' : 'expand-outline'"></ion-icon>
        {{ isFullscreen ? 'יציאה ממסך מלא' : 'מסך מלא' }}
      </button>
      <span class="presentation-toolbar__counter">{{ currentSlideIndex + 1 }} / {{ slides.length }}</span>
    </div>
  </div>

  <div class="slide-frame" aria-live="polite">
    <article class="slide" [ngClass]="'slide--' + currentSlide.layout">
      @switch (currentSlide.layout) {
        @case ('cover') {
          <div class="cover-visual" role="img" aria-label="עצמאי צעיר מוקף בניירת ובשלוש רשויות המס"></div>
          <div class="cover-message">
            <div class="cover-title" aria-label="אפשר גם אחרת">
              <span>אפשר</span><span>גם</span><span>אחרת</span>
            </div>
            <img src="/assets/login_logo.svg" alt="KeepInTax" />
          </div>
        }

        @case ('business-types') {
          <app-self-employed-opening-slide [slide]="currentSlide"></app-self-employed-opening-slide>
          <img class="slide-logo" src="/assets/login_logo.svg" alt="KeepInTax" />
        }

        @case ('authorities') {
          <app-self-employed-opening-slide [slide]="currentSlide" (navigate)="goToSlide($event)"></app-self-employed-opening-slide>
          <img class="slide-logo" src="/assets/login_logo.svg" alt="KeepInTax" />
        }

        @case ('tax-simulator') {
          <app-self-employed-tax-simulator></app-self-employed-tax-simulator>
        }

        @default {
          <app-self-employed-income-tax-slide [slide]="currentSlide"></app-self-employed-income-tax-slide>
          <img class="slide-logo" src="/assets/login_logo.svg" alt="KeepInTax" />
        }
      }
    </article>
  </div>

  <div class="presentation-controls">
    <button type="button" class="nav-button nav-button--secondary" (click)="previousSlide()" [disabled]="currentSlideIndex === 0">הקודם</button>
    <div class="progress-track" aria-hidden="true"><span [style.width.%]="progressPercent"></span></div>
    <button type="button" class="nav-button nav-button--primary" (click)="nextSlide()" [disabled]="currentSlideIndex === slides.length - 1">הבא</button>
  </div>
</section>
