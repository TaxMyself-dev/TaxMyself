<main class="mfa-page" dir="rtl">
  <section class="mfa-card">
    <h1>אימות דו־שלבי</h1>
    <p>כדי להגן על המידע הפיננסי, יש לחבר אפליקציית Authenticator לחשבון.</p>

    @if (loading()) {
      <ion-spinner name="crescent" aria-label="טוען"></ion-spinner>
    } @else if (secretKey()) {
      <ol>
        <li>פתחו Google Authenticator, Microsoft Authenticator או אפליקציה תואמת.</li>
        <li>הוסיפו חשבון באמצעות המפתח הבא:</li>
      </ol>

      <div class="secret" dir="ltr">{{ secretKey() }}</div>

      <label for="mfa-code">הזינו את הקוד בן 6 הספרות</label>
      <input
        id="mfa-code"
        name="mfa-code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        [(ngModel)]="code"
      />
      <button type="button" [disabled]="submitting() || !code.match('^\\d{6}$')" (click)="completeEnrollment()">
        {{ submitting() ? 'מאמת...' : 'הפעלת אימות דו־שלבי' }}
      </button>
    }

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </section>
</main>
