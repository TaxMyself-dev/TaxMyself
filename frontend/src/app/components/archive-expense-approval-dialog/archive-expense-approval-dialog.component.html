<app-report-review-edit-dialog
  [visible]="visible"
  [hasDocument]="true"
  [driveFileId]="document()?.driveFileId ?? null"
  [driveFileName]="document()?.driveFileName ?? ''"
  [titleLabel]="titleLabel()"
  [viewMode]="viewMode()"
  [fields]="draft()"
  [categoryOptions]="categoryOptions()"
  [subCategoryOptions]="subCategoryOptions()"
  [cardOptionsBySection]="cardOptionsBySection()"
  [documentTypeOptions]="documentTypeOptions"
  [periodOptions]="periodOptions()"
  [isSaving]="isBusy()"
  [saveLabel]="'שמור ואשר כהוצאה'"
  [saveDisabled]="!canApprove()"
  (visibleChange)="$event ? null : close()"
  (save)="approveExpense()"
  (categoryChange)="onCategoryChange($event)"
  (subCategoryChange)="onSubCategoryChange($event)"
  (cardChange)="onCardChange($event)"
  (periodChange)="onPeriodChange($event)"
  (fieldsChange)="onFieldsChange($event)">
</app-report-review-edit-dialog>
